# Runs shown in the results viewer, grouped into experiment groups.
#
# root:     directory that run `dir`s are relative to (${MIDTRAIN_ROOT} if set).
# Per run:
#   id      stable key (used in URLs / selections)
#   label   display name
#   dir     run dump_dir, relative to root (or absolute)
#   val     validation-metrics file relative to dir (default metrics.validation.jsonl).
#           The qwen3 baselines point at their val1000/ re-evaluation so every run is
#           scored on the same 1000-docs-per-domain Dolmino val sets.
#   color   categorical slot 1-8. Fixed per run so a run keeps its color in every
#           view and selection; slots must be unique across runs shown together.
#
# OLMES results are picked up from <dir>/{evals,olmes_base,olmes}/<step>/olmes_results/.

root: /checkpoint/dream-sc-3/scottg/pretrain/lingua-runs/runs/midtrain

groups:
  - id: data_repetition
    title: Data repetition (20B tokens)
    description: >
      Qwen3-0.6B from scratch for 19,074 steps (20.0B tokens) on prefixes of the first
      15M DCLM docs, repeated as needed, or a 7.5M prefix mixed 50/50 per document with
      Qwen3.5 rewrites of the same docs. Configs: apps/main/configs/experiments/.
    runs:
      - {id: dclm15m_1ep,    label: "DCLM 15M docs (×1.07)",    dir: experiments/dclm15m_1ep,    color: 1}
      - {id: dclm7p5m_2ep,   label: "DCLM 7.5M docs (×2.1)",    dir: experiments/dclm7p5m_2ep,   color: 2}
      - {id: dclm3p75m_4ep,  label: "DCLM 3.75M docs (×4.3)",   dir: experiments/dclm3p75m_4ep,  color: 3}
      - {id: dclm7p5m_rw27b, label: "DCLM 7.5M + 27B rewrites", dir: experiments/dclm7p5m_rw27b, color: 4}
      - {id: dclm7p5m_rw2b,  label: "DCLM 7.5M + 2B rewrites",  dir: experiments/dclm7p5m_rw2b,  color: 5}
      - {id: dclm7p5m_1ep,   label: "DCLM 7.5M docs (×1, 9.35B)", dir: experiments/dclm7p5m_1ep, color: 8}

  - id: qwen3_baselines
    title: Qwen3-0.6B baselines
    description: >
      Dolmino mix (24.1B tokens, apps/main/configs/qwen3_pretrain.yaml) vs DCLM only
      (20.0B tokens, qwen3_dclm_pretrain.yaml). Validation re-scored on the 1000-doc sets.
    runs:
      - {id: qwen3_mix,  label: "Dolmino mix (24.1B)", dir: qwen3_pretrain,      val: val1000/metrics.validation.jsonl, color: 6}
      - {id: qwen3_dclm, label: "DCLM only (20B)",     dir: qwen3_dclm_pretrain, val: val1000/metrics.validation.jsonl, color: 7}

  - id: expert_distillation
    title: Expert distillation (Qwen3.5 tokenizer)
    description: >
      First 7.5M DCLM docs with a Qwen3.5-tokenizer student (~694M params): CE vs token-level
      KD from Qwen3.5-2B-Base or Qwen3.5-2B (post-trained), at 1x (9,020 steps) and 20B tokens.
      Per-token NLL is not comparable with Qwen3-tokenizer runs; use bits/char and BPB.
    runs:
      - {id: q35tok_dclm7p5m_1ep,          label: "CE, 1x",                 dir: experiments/q35tok_dclm7p5m_1ep,          color: 1}
      - {id: q35tok_dclm7p5m_2ep,          label: "CE, 20B",                dir: experiments/q35tok_dclm7p5m_2ep,          color: 2}
      - {id: q35tok_kd2bbase_dclm7p5m_1ep, label: "KD 2B-Base, 1x",         dir: experiments/q35tok_kd2bbase_dclm7p5m_1ep, color: 3}
      - {id: q35tok_kd2bbase_dclm7p5m_2ep, label: "KD 2B-Base, 20B",        dir: experiments/q35tok_kd2bbase_dclm7p5m_2ep, color: 4}
      - {id: q35tok_kd2binst_dclm7p5m_1ep, label: "KD 2B post-trained, 1x", dir: experiments/q35tok_kd2binst_dclm7p5m_1ep, color: 5}
      - {id: q35tok_kd2binst_dclm7p5m_2ep, label: "KD 2B post-trained, 20B", dir: experiments/q35tok_kd2binst_dclm7p5m_2ep, color: 6}
      - {id: q35tok_kd27b_dclm7p5m_2ep,    label: "KD 27B post-trained, 20B", dir: experiments/q35tok_kd27b_dclm7p5m_2ep,  color: 7}

  - id: rephrase_wd005
    title: Rewrites vs repetition (weight decay 0.05)
    description: >
      20B tokens on the first 1.875M (or 0.9375M) DCLM docs: repeated (~8x / ~16x) vs adding 7 (or 15)
      Qwen3.5-2B or -27B rephrases per doc (simplescale g16-2m). Same colours mark the same condition
      in both weight-decay groups.
    runs:
      - {id: n1875k_real_wd005,     label: "1.875M real, ~8x (0.05)",       dir: experiments/rephrase/n1875k_real_wd005,     color: 1}
      - {id: n1875k_rw2b_k7_wd005,  label: "1.875M + 7 rw 2B (0.05)",       dir: experiments/rephrase/n1875k_rw2b_k7_wd005,  color: 2}
      - {id: n1875k_rw27b_k7_wd005, label: "1.875M + 7 rw 27B (0.05)",      dir: experiments/rephrase/n1875k_rw27b_k7_wd005, color: 3}
      - {id: n937k_real_wd005,      label: "0.94M real, ~16x (0.05)",       dir: experiments/rephrase/n937k_real_wd005,      color: 4}
      - {id: n937k_rw2b_k15_wd005,  label: "0.94M + 15 rw 2B (0.05)",       dir: experiments/rephrase/n937k_rw2b_k15_wd005,  color: 5}
      - {id: n937k_rw27b_k15_wd005, label: "0.94M + 15 rw 27B (0.05)",      dir: experiments/rephrase/n937k_rw27b_k15_wd005, color: 6}

  - id: rephrase_wd2
    title: Rewrites vs repetition (weight decay 2.0)
    description: >
      20B tokens on the first 1.875M (or 0.9375M) DCLM docs: repeated (~8x / ~16x) vs adding 7 (or 15)
      Qwen3.5-2B or -27B rephrases per doc (simplescale g16-2m). Same colours mark the same condition
      in both weight-decay groups.
    runs:
      - {id: n1875k_real_wd2,     label: "1.875M real, ~8x (2.0)",       dir: experiments/rephrase/n1875k_real_wd2,     color: 1}
      - {id: n1875k_rw2b_k7_wd2,  label: "1.875M + 7 rw 2B (2.0)",       dir: experiments/rephrase/n1875k_rw2b_k7_wd2,  color: 2}
      - {id: n1875k_rw27b_k7_wd2, label: "1.875M + 7 rw 27B (2.0)",      dir: experiments/rephrase/n1875k_rw27b_k7_wd2, color: 3}
      - {id: n937k_real_wd2,      label: "0.94M real, ~16x (2.0)",       dir: experiments/rephrase/n937k_real_wd2,      color: 4}
      - {id: n937k_rw2b_k15_wd2,  label: "0.94M + 15 rw 2B (2.0)",       dir: experiments/rephrase/n937k_rw2b_k15_wd2,  color: 5}
      - {id: n937k_rw27b_k15_wd2, label: "0.94M + 15 rw 27B (2.0)",      dir: experiments/rephrase/n937k_rw27b_k15_wd2, color: 6}

  - id: wd_sweep_n1875k
    title: Weight decay sweep, 1.875M real docs (~8.5x)
    description: >
      20B tokens on the first 1.875M DCLM docs, repeated; only weight decay changes (applied to
      all parameters, as in lingua's AdamW).
    runs:
      - {id: n1875k_real_wd005_s, label: "wd 0.05", dir: experiments/rephrase/n1875k_real_wd005, color: 1}
      - {id: n1875k_real_wd02,    label: "wd 0.2",  dir: experiments/rephrase/n1875k_real_wd02,  color: 2}
      - {id: n1875k_real_wd05,    label: "wd 0.5",  dir: experiments/rephrase/n1875k_real_wd05,  color: 3}
      - {id: n1875k_real_wd1,     label: "wd 1.0",  dir: experiments/rephrase/n1875k_real_wd1,   color: 4}
      - {id: n1875k_real_wd2_s,   label: "wd 2.0",  dir: experiments/rephrase/n1875k_real_wd2,   color: 5}

  - id: wd_sweep_n937k
    title: Weight decay sweep, 0.94M real docs (~17x)
    description: >
      20B tokens on the first 937,500 DCLM docs, repeated; only weight decay changes.
    runs:
      - {id: n937k_real_wd005_s, label: "wd 0.05", dir: experiments/rephrase/n937k_real_wd005, color: 1}
      - {id: n937k_real_wd02,    label: "wd 0.2",  dir: experiments/rephrase/n937k_real_wd02,  color: 2}
      - {id: n937k_real_wd05,    label: "wd 0.5",  dir: experiments/rephrase/n937k_real_wd05,  color: 3}
      - {id: n937k_real_wd1,     label: "wd 1.0",  dir: experiments/rephrase/n937k_real_wd1,   color: 4}
      - {id: n937k_real_wd2_s,   label: "wd 2.0",  dir: experiments/rephrase/n937k_real_wd2,   color: 5}

  - id: latent_thoughts
    title: Latent thoughts (1.875M docs, 20B tokens)
    description: >
      The first 1.875M DCLM docs with Qwen3.5-2B / -27B <think> blocks inserted between g pieces
      (g = 4, 8, 16), trained on alone; vs the same docs repeated (~8.5x). Weight decay 0.05.
    runs:
      - {id: n1875k_real_wd005_l, label: "real only (~8.5x)", dir: experiments/rephrase/n1875k_real_wd005, color: 1}
      - {id: lat2b_g4_n1875k_wd005,  label: "2B thoughts, g4",  dir: experiments/latent/lat2b_g4_n1875k_wd005,  color: 2}
      - {id: lat2b_g8_n1875k_wd005,  label: "2B thoughts, g8",  dir: experiments/latent/lat2b_g8_n1875k_wd005,  color: 3}
      - {id: lat2b_g16_n1875k_wd005, label: "2B thoughts, g16", dir: experiments/latent/lat2b_g16_n1875k_wd005, color: 4}
      - {id: lat27b_g4_n1875k_wd005,  label: "27B thoughts, g4",  dir: experiments/latent/lat27b_g4_n1875k_wd005,  color: 5}
      - {id: lat27b_g8_n1875k_wd005,  label: "27B thoughts, g8",  dir: experiments/latent/lat27b_g8_n1875k_wd005,  color: 6}
      - {id: lat27b_g16_n1875k_wd005, label: "27B thoughts, g16", dir: experiments/latent/lat27b_g16_n1875k_wd005, color: 7}

  - id: epochs_n937k_wd005
    title: Epoch tuning, 0.94M real docs (wd 0.05)
    description: >
      The first 937,500 DCLM docs repeated for 4 / 8 / 12 / 17 epochs (each with its own full
      cosine schedule), vs the same docs + 15 Qwen3.5-2B rewrites each (20B tokens). Weight decay 0.05.
    runs:
      - {id: ep_n937k_real_ep4_wd005,  label: "real, 4 epochs (4.7B tok)",   dir: experiments/rephrase/n937k_real_ep4_wd005,  color: 1}
      - {id: ep_n937k_real_ep8_wd005,  label: "real, 8 epochs (9.4B tok)",   dir: experiments/rephrase/n937k_real_ep8_wd005,  color: 2}
      - {id: ep_n937k_real_ep12_wd005, label: "real, 12 epochs (14.1B tok)", dir: experiments/rephrase/n937k_real_ep12_wd005, color: 3}
      - {id: ep_n937k_real_ep17_wd005, label: "real, 17 epochs (20B tok)",   dir: experiments/rephrase/n937k_real_wd005,      color: 4}
      - {id: ep_n937k_rw2b_k15_wd005,  label: "+ 15 rewrites 2B (20B tok)",  dir: experiments/rephrase/n937k_rw2b_k15_wd005,  color: 5}

  - id: epochs_n937k_wd02
    title: Epoch tuning, 0.94M real docs (wd 0.2)
    description: >
      The first 937,500 DCLM docs repeated for 4 / 8 / 12 / 17 epochs (each with its own full
      cosine schedule), vs the same docs + 15 Qwen3.5-2B rewrites each (20B tokens). Weight decay 0.2.
    runs:
      - {id: ep_n937k_real_ep4_wd02,  label: "real, 4 epochs (4.7B tok)",   dir: experiments/rephrase/n937k_real_ep4_wd02,  color: 1}
      - {id: ep_n937k_real_ep8_wd02,  label: "real, 8 epochs (9.4B tok)",   dir: experiments/rephrase/n937k_real_ep8_wd02,  color: 2}
      - {id: ep_n937k_real_ep12_wd02, label: "real, 12 epochs (14.1B tok)", dir: experiments/rephrase/n937k_real_ep12_wd02, color: 3}
      - {id: ep_n937k_real_ep17_wd02, label: "real, 17 epochs (20B tok)",   dir: experiments/rephrase/n937k_real_wd02,      color: 4}
      - {id: ep_n937k_rw2b_k15_wd02,  label: "+ 15 rewrites 2B (20B tok)",  dir: experiments/rephrase/n937k_rw2b_k15_wd02,  color: 5}

  - id: epochs_n937k_wd05
    title: Epoch tuning, 0.94M real docs (wd 0.5)
    description: >
      The first 937,500 DCLM docs repeated for 4 / 8 / 12 / 17 epochs (each with its own full
      cosine schedule), vs the same docs + 15 Qwen3.5-2B rewrites each (20B tokens). Weight decay 0.5.
    runs:
      - {id: ep_n937k_real_ep4_wd05,  label: "real, 4 epochs (4.7B tok)",   dir: experiments/rephrase/n937k_real_ep4_wd05,  color: 1}
      - {id: ep_n937k_real_ep8_wd05,  label: "real, 8 epochs (9.4B tok)",   dir: experiments/rephrase/n937k_real_ep8_wd05,  color: 2}
      - {id: ep_n937k_real_ep12_wd05, label: "real, 12 epochs (14.1B tok)", dir: experiments/rephrase/n937k_real_ep12_wd05, color: 3}
      - {id: ep_n937k_real_ep17_wd05, label: "real, 17 epochs (20B tok)",   dir: experiments/rephrase/n937k_real_wd05,      color: 4}
      - {id: ep_n937k_rw2b_k15_wd05,  label: "+ 15 rewrites 2B (20B tok)",  dir: experiments/rephrase/n937k_rw2b_k15_wd05,  color: 5}
