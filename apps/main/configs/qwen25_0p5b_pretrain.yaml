# From-scratch pretraining of a Qwen2.5-0.5B-shaped model on the Dolmino mix
# (same sources / weights as dolmino_pretrain.yaml), with the Qwen2.5 tokenizer.
#
# Matches Qwen2.5-0.5B (hf config.json): dim 896, 24 layers, 14 q / 2 kv heads
# (head_dim 64), SwiGLU 4864, RMSNorm eps 1e-6, pre-norm, no QK-norm,
# RoPE theta 1e6, tied embeddings, QKV bias, 0.02 init. ~0.49B params total
# (0.36B non-embedding).
#
# Known deviations from real Qwen2.5 (need code changes to close):
#   - Embedding init uses dim**-0.5 (~0.033) rather than 0.02; init_base_std
#     only reaches the transformer blocks.
#   - Vocab is len(tokenizer) = 151665 rather than Qwen's padded 151936.
#
# Tokenizer: Qwen/Qwen2.5-0.5B (base; eos = <|endoftext|>, no BOS) at the path
# under data.tokenizer.path below.
#
# Budget at the defaults (2 nodes = 16 GPUs):
#   8 seq/GPU x 4096 tok x 16 GPU x 2 grad_acc = ~1.05M tokens/step
#   20000 steps = ~21B tokens (~43 tokens/param).
name: qwen25-0p5b-dolmino
dump_dir: ${oc.env:MIDTRAIN_ROOT}/qwen25_0p5b_pretrain
steps: 20000
probe_freq: null
seed: 777
grad_acc_steps: 2

optim:
  lr: 3e-3
  weight_decay: 0.033
  warmup: 2000
  lr_min_ratio: 0.01
  clip: 1.0
  beta1: 0.9
  beta2: 0.95
  scheduler: cosine

distributed:
  fsdp_type: full_shard
  compile: true
  model_dtype: bf16
  matmul_allow_tf32: true
  selective_activation_checkpointing: false
  tp_size: 1

# Qwen2.5-0.5B shape.
model:
  dim: 896
  n_layers: 24
  n_heads: 14
  n_kv_heads: 2
  ffn_dim_multiplier: 2.0     # round_up(2.0 * int(8*896/3), 256) = 4864
  multiple_of: 256
  norm_eps: 1e-6
  rope_theta: 1000000
  max_seqlen: 4096
  weight_tying: true
  qk_norm: false
  qkv_bias: true
  post_norm: false
  hf_arch: Qwen2ForCausalLM
  init_base_std: 0.02

checkpoint:
  init_ckpt_path: null
  dump:
    every: 1000
    keep: -1
  eval:
    every: 1000
    keep: -1

data:
  root_dir: ${oc.env:DATA_ROOT}
  batch_size: 8
  prefetch_size: 64
  seq_len: 4096
  n_views: 2
  load_async: true
  add_bos: false              # Qwen tokenizer has no BOS token
  add_eos: true               # <|endoftext|> between documents
  disable_cross_doc_attn: true
  sources:
    dclm_shuffled: 0.472
    math_shuffled: 0.208
    flan_shuffled: 0.166
    wiki_shuffled: 0.0711
    pes2o_shuffled: 0.0585
    stackexchange_shuffled: 0.0245
  tokenizer:
    name: hf
    path: /home/sgeng/scottg/pretrain/assets/models/Qwen2.5-0.5B

profiling:
  run: false

logging:
  freq: 10
  wandb:
    project: "lingua-clean-pretrain"
    entity: ${oc.env:WANDB_ENTITY,null}
    resume: allow

# Async eval = held-out perplexity on each Dolmino source only (<source>/*.val.jsonl). Downstream
# harness tasks are skipped: a 0.6B model this early scores ~chance on them.
async_eval_gpus: 1
eval:
  dump_dir: ${oc.env:EVAL_ROOT}/slurm_eval_logs
  generator:
    max_tokens: 4096
    dtype: bf16
  harness: null
  validation:
    max_steps: 1000
    use_val_from_train_src: true
    root_dir: ${oc.env:DATA_ROOT}
    sources: []
