# CE pretraining on dclm_8m_0, 10.0B tokens, lr 0.00265. Generated by setup/make_gb300_configs.py.
#   CONFIG=experiments/gb300/pt_dclm8m0_lr2p65e3 NNODES=4 STEPS_OVERRIDE=9537 bash scripts/launch_pretrain.sh
name: qwen3-0p6b-gb300-pt-dclm8m0-lr2p65e3
dump_dir: ${oc.env:MIDTRAIN_ROOT}/experiments/gb300/pt_dclm8m0_lr2p65e3
steps: 9537
probe_freq: null
seed: 777
grad_acc_steps: 1
optim:
  lr: 0.00265
  weight_decay: 0.1
  warmup: 954
  lr_min_ratio: 0.01
  clip: 1.0
  beta1: 0.9
  beta2: 0.95
  scheduler: cosine
distributed:
  fsdp_type: full_shard
  compile: true
  model_dtype: bf16
  matmul_allow_tf32: true
  selective_activation_checkpointing: false
  tp_size: 1
model:
  dim: 1024
  n_layers: 28
  n_heads: 16
  n_kv_heads: 8
  head_dim: 128
  ffn_dim_multiplier: 1.125
  multiple_of: 256
  norm_eps: 1.0e-06
  rope_theta: 1000000
  max_seqlen: 4096
  weight_tying: true
  qk_norm: true
  qk_norm_per_head: true
  post_norm: false
  hf_arch: Qwen3ForCausalLM
  init_base_std: 0.02
  seed: 42
checkpoint:
  init_ckpt_path: null
  dump:
    every: 500
    keep: 2
  eval:
    every: 1000000
    keep: -1
data:
  root_dir: /home/sgeng/scottg/pretrain/assets/data
  seed: 42
  batch_size: 16
  prefetch_size: 64
  seq_len: 4096
  n_views: 2
  load_async: true
  add_bos: false
  add_eos: true
  disable_cross_doc_attn: true
  sources:
    dclm_subsets/dclm_8m_0: 1.0
  tokenizer:
    name: hf
    path: /home/sgeng/scottg/pretrain/assets/models/Qwen3.5-2B-tokenizer-eot
