# From-scratch pretraining of a Llama-3.2-1B-shaped model on the full Dolmino
# mid-train mix (same six shards / same weights as
# `dolmino_midtrain_olmo2_v2.yaml`). Ported from the original lingua repo's
# `apps/main/configs/dclm_pt.yaml` — same architecture and optimizer; the only
# differences are (a) paths swapped for env vars and (b) data sources point at
# the full Dolmino mix rather than the standalone DCLM-750B mix the upstream
# config used.
#
# Notes:
#   - `checkpoint.init_ckpt_path: null` — this is from-scratch pretraining.
#     Mid-training recipes set this to ${oc.env:STUDENT_INIT_PATH} instead.
#   - 9600 steps × 8 grad_acc × 8 GPU × 8 seq/GPU × 4096 tok ≈ 26B tokens
#     at 2 nodes (the launch_pretrain.sh default).
#   - Eval is GSM8K via the lm-eval-harness (`harness:`), not OLMES — matches
#     the original. Swap to `olmes:` if you want comparable numbers with the
#     mid-training recipes.
name: dclm-pt-llama-1b
dump_dir: ${oc.env:MIDTRAIN_ROOT}/dclm_pt
steps: 9600
probe_freq: null
seed: 777
grad_acc_steps: 8

optim:
  lr: 3e-3
  weight_decay: 0.033
  warmup: 1000
  lr_min_ratio: 0.01
  clip: 1.0
  beta1: 0.9
  beta2: 0.95
  scheduler: cosine

distributed:
  fsdp_type: full_shard
  compile: true
  model_dtype: bf16
  matmul_allow_tf32: true
  selective_activation_checkpointing: false
  tp_size: 1

# Llama-3.2-1B shape (matches original dclm_pt.yaml).
model:
  dim: 2048
  n_layers: 16
  n_heads: 32
  head_dim: 64
  n_kv_heads: 8
  ffn_dim_multiplier: 1.5
  weight_tying: false
  norm_eps: 1e-5

checkpoint:
  init_ckpt_path: null
  dump:
    every: 1000
    keep: -1
  eval:
    every: 1000
    keep: -1

data:
  root_dir: ${oc.env:DATA_ROOT}
  batch_size: 8
  prefetch_size: 64
  seq_len: 4096
  n_views: 2
  load_async: true
  add_bos: true
  add_eos: true
  sources:
    dclm_shuffled: 0.472           # 47.2% DCLM Baseline
    math_shuffled: 0.208           # 20.8% Stage 2 Math (critical for GSM8K!)
    flan_shuffled: 0.166           # 16.6% FLAN
    wiki_shuffled: 0.0711          # 7.11% Wiki
    pes2o_shuffled: 0.0585         # 5.85% pes2o
    stackexchange_shuffled: 0.0245 # 2.45% StackExchange
  tokenizer:
    name: hf
    path: ${oc.env:TOKENIZER_PATH}

profiling:
  run: false

logging:
  freq: 10
  wandb:
    project: "lingua-clean-pretrain"
    entity: ${oc.env:WANDB_ENTITY,null}
    resume: allow

async_eval_gpus: 1
eval:
  dump_dir: ${oc.env:EVAL_ROOT}/slurm_eval_logs
  generator:
    max_tokens: 2048
    temperature: 0.7
    top_p: 0.95
    dtype: bf16
  harness:
    tasks:
      - gsm8k
  validation:
    max_steps: 1000
    use_val_from_train_src: false
    root_dir: ${oc.env:DATA_ROOT}
    sources:
      - dolmino_val
